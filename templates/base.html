<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SAML + Duo{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="{{ url_for('index') }}">SAML SP Demo</a>
    <div class="links">
      <a href="{{ url_for('index') }}">Home</a>
      {% if session.get('samlNameId') %}<a href="{{ url_for('profile') }}">Profile</a>{% endif %}
      <a href="{{ url_for('admin_config') if session.get('is_admin') else url_for('admin_login') }}">Admin</a>
    </div>
  </nav>
  <main class="wrap {% block main_class %}{% endblock %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
