{% extends "base.html" %}
{% block title %}SAML error{% endblock %}
{% block content %}
<div class="card">
  <h1>SAML login failed</h1>
  <div class="alert error">
    <strong>Errors:</strong> {{ errors|join(', ') }}
    {% if reason %}<br><strong>Reason:</strong> {{ reason }}{% endif %}
  </div>
  <div class="actions">
    <a class="btn secondary" href="{{ url_for('index') }}">Back home</a>
  </div>
</div>
{% endblock %}
