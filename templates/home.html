<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SAML + Duo Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; color: #1a1a1a; }
    a.button { display: inline-block; padding: 0.6rem 1.2rem; background: #0057b8; color: #fff;
               text-decoration: none; border-radius: 6px; font-weight: 600; }
    code { background: #f2f2f2; padding: 0.1rem 0.35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>SAML SP Demo</h1>
  {% if name_id %}
    <p>Signed in as <strong>{{ name_id }}</strong>.</p>
    <p><a href="{{ url_for('profile') }}">View profile / attributes</a></p>
    <p><a href="{{ url_for('logout') }}">Log out</a></p>
  {% else %}
    <p>Not signed in.</p>
    <p><a class="button" href="{{ url_for('login') }}">Log in with Duo</a></p>
  {% endif %}
  <hr>
  <p>SP metadata for configuring Duo: <code>{{ url_for('metadata', _external=True) }}</code></p>
</body>
</html>
